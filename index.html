<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>SnowDuo | Game Development Studio</title>
    <meta name="title" content="SnowDuo | Game Development Studio" />
    <meta name="description" content="SnowDuo - niezależne studio tworzące unikalne gry. Dołącz do naszej przygody!" />
    <meta name="keywords" content="SnowDuo, game dev, game development, indie games, gry, studio gier, tworzenie gier" />
    <meta name="author" content="SnowDuo" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://snowduo.github.io/" />
    <meta property="og:title" content="SnowDuo | Game Development Studio" />
    <meta property="og:description" content="SnowDuo - niezależne studio tworzące unikalne gry. Dołącz do naszej przygody!" />
    <meta property="og:image" content="https://snowduo.github.io/logo.png" />
    <meta property="og:locale" content="pl_PL" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://snowduo.github.io/" />
    <meta property="twitter:title" content="SnowDuo | Game Development Studio" />
    <meta property="twitter:description" content="SnowDuo - niezależne studio tworzące unikalne gry. Dołącz do naszej przygody!" />
    <meta property="twitter:image" content="https://snowduo.github.io/logo.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://snowduo.github.io/" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SnowDuo",
      "description": "Niezależne studio tworzące unikalne gry",
      "url": "https://snowduo.github.io/",
      "logo": "https://snowduo.github.io/logo.png",
      "sameAs": []
    }
    </script>
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
      }
      
      .logo-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .logo {
        max-width: 100%;
        max-height: 100%;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      
      .sr-only {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="logo-container">
      <img 
        src="logo.png" 
        alt="SnowDuo - Game Development Studio - Logo przedstawiające niedźwiedzia polarnego z pingwinem w pomarańczowych szalikach" 
        class="logo"
      />
    </main>
    <h1 class="sr-only">SnowDuo - Game Development Studio</h1>
  </body>
</html>
